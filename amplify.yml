version: 1
frontend:
  phases:
    preBuild:
      commands:
        - python3 -m venv /tmp/portfolio-build-venv
        - /tmp/portfolio-build-venv/bin/python -m pip install -r requirements.txt
    build:
      commands:
        - /tmp/portfolio-build-venv/bin/python -m unittest discover -s tests -v
        - /tmp/portfolio-build-venv/bin/python build_static.py
        - test -f out/index.html
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
